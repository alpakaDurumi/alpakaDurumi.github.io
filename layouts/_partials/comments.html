{{- /* giscus comments — PaperMod 라이트/다크 토글과 테마 동기화 */ -}}
<script>
  (function (self) {
    function giscusTheme() {
      var t = document.documentElement.dataset.theme;
      if (t === "dark") return "dark_dimmed";
      if (t === "light") return "light";
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark_dimmed" : "light";
    }

    // 현재 PaperMod 테마에 맞춰 giscus 주입
    var s = document.createElement("script");
    s.src = "https://giscus.app/client.js";
    s.setAttribute("data-repo", "alpakaDurumi/alpakaDurumi.github.io");
    s.setAttribute("data-repo-id", "R_kgDOS9F8Lw");
    s.setAttribute("data-category", "Announcements");
    s.setAttribute("data-category-id", "DIC_kwDOS9F8L84C_etJ");
    s.setAttribute("data-mapping", "pathname");
    s.setAttribute("data-strict", "1");
    s.setAttribute("data-reactions-enabled", "1");
    s.setAttribute("data-emit-metadata", "0");
    s.setAttribute("data-input-position", "bottom");
    s.setAttribute("data-theme", giscusTheme());
    s.setAttribute("data-lang", "ko");
    s.setAttribute("crossorigin", "anonymous");
    s.async = true;
    self.parentNode.appendChild(s);

    // 토글로 html[data-theme]가 바뀌면 giscus 테마도 갱신
    new MutationObserver(function () {
      var iframe = document.querySelector("iframe.giscus-frame");
      if (!iframe) return;
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme: giscusTheme() } } },
        "https://giscus.app"
      );
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  })(document.currentScript);
</script>
